<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffice</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f4ec;
        color: #284d41;
        font:
          16px/1.6 "Segoe UI",
          sans-serif;
      }
      main {
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        margin: 0;
      }
      p {
        margin: 7px 0;
        color: #677c70;
      }
      .dots {
        letter-spacing: 7px;
        animation: breathe 1.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>Coffice</h1>
      <p>Turning on the office lights.</p>
      <p class="dots" aria-label="Loading">•••</p>
    </main>
  </body>
</html>
